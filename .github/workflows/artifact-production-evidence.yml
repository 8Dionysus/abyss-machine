name: Artifact Production Evidence

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Public-safe artifact class to package and attest
        required: true
        type: choice
        default: bootstrap_install_bundle
        options:
          - bootstrap_install_bundle
          - code_intelligence_provider

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bootstrap_install_bundle:
    name: Bootstrap Install Bundle Evidence
    if: ${{ inputs.artifact == 'bootstrap_install_bundle' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.1

      - name: Run release artifact gate
        run: python scripts/ci_gate.py --mode release-artifact

      - name: Build deterministic bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="dist/abyss-machine-bootstrap-${GITHUB_SHA}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "${artifact}" \
            scripts/abyss-machine-bootstrap \
            src/abyss_machine \
            config-templates \
            generated \
            manifests \
            systemd \
            schemas/bootstrap-report.schema.json
          sha256sum "${artifact}" > "${artifact}.sha256"

      - name: Build and sign bootstrap evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="dist/bootstrap-bundle"
          python -m abyss_machine.cli artifacts build-sidecars \
            --manifest manifests/artifact_bundles/bootstrap_install_bundle.bundle.json \
            --bundle-dir "${bundle_dir}" \
            --json
          python -m abyss_machine.cli artifacts sign "${bundle_dir}" \
            --backend cosign-github-oidc \
            --json
          cosign verify-blob \
            --bundle "${bundle_dir}/artifact.sigstore.json" \
            --certificate-identity "https://github.com/8Dionysus/abyss-machine/.github/workflows/artifact-production-evidence.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-name "Artifact Production Evidence" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-repository "8Dionysus/abyss-machine" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-github-workflow-trigger "workflow_dispatch" \
            "${bundle_dir}/artifact.subjects.json"
          python -m abyss_machine.cli artifacts verify "${bundle_dir}" \
            --subject-root . \
            --json
          python -m abyss_machine.cli artifacts release-check "${bundle_dir}" \
            --subject-root . \
            --json
          evidence="dist/abyss-machine-bootstrap-evidence-${GITHUB_SHA}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "${evidence}" -C "${bundle_dir}" .
          sha256sum "${evidence}" > "${evidence}.sha256"

      - name: Upload bootstrap archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abyss-machine-bootstrap-${{ github.sha }}
          path: |
            dist/abyss-machine-bootstrap-${{ github.sha }}.tar.gz
            dist/abyss-machine-bootstrap-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload bootstrap signature evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abyss-machine-bootstrap-evidence-${{ github.sha }}
          path: |
            dist/abyss-machine-bootstrap-evidence-${{ github.sha }}.tar.gz
            dist/abyss-machine-bootstrap-evidence-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attest bootstrap archive
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: dist/abyss-machine-bootstrap-${{ github.sha }}.tar.gz

  code_intelligence_provider:
    name: Code Intelligence Provider Evidence
    if: ${{ inputs.artifact == 'code_intelligence_provider' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.1

      - name: Run release artifact gate
        run: python scripts/ci_gate.py --mode release-artifact

      - name: Build Universal Ctags 6.2.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkg-config libjansson-dev libyaml-dev libseccomp-dev libxml2-dev
          source_root="${RUNNER_TEMP}/universal-ctags"
          git clone --filter=blob:none https://github.com/universal-ctags/ctags.git "${source_root}"
          git -C "${source_root}" checkout --detach b8eb0da4121372b5d74a90fc36cba6a31f147f3c
          test "$(git -C "${source_root}" rev-parse HEAD)" = b8eb0da4121372b5d74a90fc36cba6a31f147f3c
          (cd "${source_root}" && ./autogen.sh && ./configure --prefix="${RUNNER_TEMP}/universal-ctags-install" && make -j2 && make install)
          "${RUNNER_TEMP}/universal-ctags-install/bin/ctags" --version | grep -F 'Universal Ctags 6.2.1'

      - name: Build complete deterministic provider archives
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${GITHUB_WORKSPACE}/dist/code-intelligence"
          mkdir -p "${artifact_root}"
          ctags_artifact="${artifact_root}/abyss-machine-code-intelligence-universal-ctags-6.2.1-${GITHUB_SHA}.tar.gz"
          python scripts/build_code_intelligence_provider.py \
            --ctags "${RUNNER_TEMP}/universal-ctags-install/bin/ctags" \
            --output "${ctags_artifact}" \
            --source-ref "commit:${GITHUB_SHA}" \
            --artifact-root "${artifact_root}" \
            --json
          node_artifact="${artifact_root}/abyss-machine-code-intelligence-node-providers-${GITHUB_SHA}.tar.gz"
          python scripts/build_code_intelligence_node_providers.py \
            --output "${node_artifact}" \
            --source-ref "commit:${GITHUB_SHA}" \
            --artifact-root "${artifact_root}" \
            --temporary-root "${RUNNER_TEMP}" \
            --npm-cache "${RUNNER_TEMP}/npm-cache" \
            --json
          adjacent_artifact="${artifact_root}/abyss-machine-code-intelligence-adjacent-providers-semgrep-1.175.0-syft-1.45.1-in-toto-3.1.0-markitdown-0.1.7-${GITHUB_SHA}.tar.gz"
          python scripts/build_code_intelligence_adjacent_providers.py \
            --output "${adjacent_artifact}" \
            --source-ref "commit:${GITHUB_SHA}" \
            --artifact-root "${artifact_root}" \
            --temporary-root "${RUNNER_TEMP}" \
            --json
          for artifact in "${ctags_artifact}" "${node_artifact}" "${adjacent_artifact}"; do
            sha256sum "${artifact}" > "${artifact}.sha256"
          done

      - name: Build and sign code-intelligence evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${GITHUB_WORKSPACE}/dist/code-intelligence"
          bundle_dir="${GITHUB_WORKSPACE}/dist/code-intelligence-bundle"
          python -m abyss_machine.cli artifacts build-sidecars \
            --manifest manifests/artifact_bundles/code_intelligence_provider.bundle.json \
            --subject-root "${artifact_root}" \
            --owner-repo abyss-machine \
            --source-ref "commit:${GITHUB_SHA}" \
            --bundle-dir "${bundle_dir}" \
            --json
          python -m abyss_machine.cli artifacts sign "${bundle_dir}" \
            --backend cosign-github-oidc \
            --json
          cosign verify-blob \
            --bundle "${bundle_dir}/artifact.sigstore.json" \
            --certificate-identity "https://github.com/8Dionysus/abyss-machine/.github/workflows/artifact-production-evidence.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-name "Artifact Production Evidence" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-repository "8Dionysus/abyss-machine" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-github-workflow-trigger "workflow_dispatch" \
            "${bundle_dir}/artifact.subjects.json"
          python -m abyss_machine.cli artifacts verify "${bundle_dir}" \
            --subject-root "${artifact_root}" \
            --json
          python -m abyss_machine.cli artifacts release-check "${bundle_dir}" \
            --subject-root "${artifact_root}" \
            --json
          evidence="${GITHUB_WORKSPACE}/dist/abyss-machine-code-intelligence-evidence-${GITHUB_SHA}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "${evidence}" -C "${bundle_dir}" .
          sha256sum "${evidence}" > "${evidence}.sha256"

      - name: Upload complete provider plane
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abyss-machine-code-intelligence-provider-${{ github.sha }}
          path: |
            dist/code-intelligence/*.tar.gz
            dist/code-intelligence/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload code-intelligence signature evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abyss-machine-code-intelligence-evidence-${{ github.sha }}
          path: |
            dist/abyss-machine-code-intelligence-evidence-${{ github.sha }}.tar.gz
            dist/abyss-machine-code-intelligence-evidence-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attest complete provider plane
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: dist/code-intelligence/*.tar.gz
