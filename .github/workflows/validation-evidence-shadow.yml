name: Validation Evidence Shadow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
  ABYSS_MACHINE_AOA_SDK_ROOT: ${{ github.workspace }}/.deps/aoa-sdk

jobs:
  combined_scheduler:
    name: Full DAG + ${{ matrix.method }} (W${{ matrix.workers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: [xdist-2, xdist-4, static-2]
        workers: [2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Checkout aoa-stats protocol owner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: fb984e66f88abf772fce6aa29587337e2e8efcdc
          path: .deps/aoa-stats
          persist-credentials: false

      - name: Checkout pinned aoa-sdk scheduler
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-sdk
          ref: b73c8aca9ef5275df0ec9e3e55d446db08823fb2
          path: .deps/aoa-sdk
          persist-credentials: false

      - name: Install comparison dependencies
        run: python -m pip install -e '.[dev]' pytest-xdist==3.8.0

      - name: Run complete scheduler comparison
        id: comparison
        continue-on-error: true
        run: >-
          python scripts/validation_scheduler_experiment.py
          --method ${{ matrix.method }}
          --graph-workers ${{ matrix.workers }}
          --receipt combined-${{ matrix.method }}-w${{ matrix.workers }}.json

      - name: Record comparison outcome
        if: always()
        run: >-
          echo "DAG W${{ matrix.workers }} + ${{ matrix.method }}
          outcome=${{ steps.comparison.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-shadow-${{ matrix.method }}-w${{ matrix.workers }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: combined-${{ matrix.method }}-w${{ matrix.workers }}*.json
          if-no-files-found: warn
          retention-days: 14
